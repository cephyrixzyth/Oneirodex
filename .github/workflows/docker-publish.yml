# Publish the all-in-one image on a version tag (or by hand).
#
# GHCR needs nothing but the built-in GITHUB_TOKEN. Docker Hub is pushed only
# when the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret exist, so a fork
# without them still publishes to its own GHCR namespace.
# Unraid Community Apps template points at Docker Hub: unraid/oneirodex.xml.
name: Docker publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: oneirodex

jobs:
  tests:
    name: Test suite
    uses: ./.github/workflows/ci-tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub available?
        id: hub
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user_present=false
          token_present=false
          if [ -n "$HUB_USER" ]; then user_present=true; fi
          if [ -n "$HUB_TOKEN" ]; then token_present=true; fi
          echo "username_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "token_present=$token_present" >> "$GITHUB_OUTPUT"
          echo "Docker Hub username variable present: $user_present; token secret present: $token_present"
          if [ "$user_present" = true ] && [ "$token_present" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.hub.outputs.enabled == 'true' && format('{0}/{1}', vars.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ONEIRODEX_BUILD_SHA=${{ github.sha }}
            ONEIRODEX_BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

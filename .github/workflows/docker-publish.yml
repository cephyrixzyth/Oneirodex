# Publish the all-in-one image on a version tag (or by hand).
#
# GHCR needs nothing but the built-in GITHUB_TOKEN. Docker Hub is pushed only
# when the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN environment secret exist,
# so a fork without them still publishes to its own GHCR namespace.
# Unraid Community Apps template points at Docker Hub: unraid/oneirodex.xml.
name: Docker publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: oneirodex

jobs:
  tests:
    name: Test suite
    uses: ./.github/workflows/ci-tests.yml

  publish:
    needs: tests
    # Manual publishes are release operations and must build the default branch.
    # Version tags remain the normal immutable release path.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release tag before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          tag_version="${RELEASE_REF#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$tag_version" != "$version" ]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH and match VERSION."
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub available?
        id: hub
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user_present=false
          token_present=false
          if [ -n "$HUB_USER" ]; then user_present=true; fi
          if [ -n "$HUB_TOKEN" ]; then token_present=true; fi
          echo "username_present=$user_present" >> "$GITHUB_OUTPUT"
          echo "token_present=$token_present" >> "$GITHUB_OUTPUT"
          echo "Docker Hub username variable present: $user_present; token secret present: $token_present"
          if [ "$user_present" = true ] && [ "$token_present" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.hub.outputs.enabled == 'true' && format('{0}/{1}', vars.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ONEIRODEX_BUILD_SHA=${{ github.sha }}
            ONEIRODEX_BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stamp Docker Hub overview version
        if: steps.hub.outputs.enabled == 'true'
        run: |
          version="$(cat VERSION)"
          sed "s/__VERSION__/${version}/g" docs/dockerhub-overview.md > "$RUNNER_TEMP/dockerhub-overview.md"

      - name: Sync Docker Hub repository overview
        if: steps.hub.outputs.enabled == 'true'
        # Image publication and the CA feed must not fail because Hub's
        # separate repository-metadata API rejects an overview update.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/oneirodex
          short-description: "Self-hosted household game library for Docker and Unraid, with metadata, artwork and play."
          readme-filepath: ${{ runner.temp }}/dockerhub-overview.md
          enable-url-completion: true

  sync-ca-template:
    name: Sync Unraid Community Apps template
    needs: [tests, publish]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cephyrixzyth/unraid-templates
          ref: main
          path: template-repo
          # The catalog is public. Read-only comparison needs no external write token.

      - name: Publish the release-matched CA template
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          TEMPLATE_TOKEN: ${{ secrets.UNRAID_TEMPLATES_TOKEN }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "$version" != "$(cat VERSION)" ]; then
            echo "::error::Release tag version does not match VERSION."
            exit 1
          fi
          sed "s/__VERSION__/${version}/g" unraid/oneirodex.xml > "$RUNNER_TEMP/oneirodex.xml"
          if cmp -s "$RUNNER_TEMP/oneirodex.xml" template-repo/oneirodex/oneirodex.xml; then
            echo "CA feed already matches ${version}; no write token is needed."
            exit 0
          fi
          if [ -z "$TEMPLATE_TOKEN" ]; then
            echo "::error::Set UNRAID_TEMPLATES_TOKEN with Contents read/write access to cephyrixzyth/unraid-templates."
            exit 1
          fi
          echo "::add-mask::${TEMPLATE_TOKEN}"
          cp "$RUNNER_TEMP/oneirodex.xml" template-repo/oneirodex/oneirodex.xml
          cd template-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oneirodex/oneirodex.xml
          git commit -m "chore(unraid): sync Oneirodex ${version} template"
          git remote set-url origin "https://x-access-token:${TEMPLATE_TOKEN}@github.com/cephyrixzyth/unraid-templates.git"
          git push origin HEAD:main

# Oneirodex CI — PR gate with a *core* pytest subset (+ member-app / desktop vitest).
#
# Full pytest suite remains local / release-time (needs Unraid-like fixtures,
# library paths, and heavier integrations). Do not treat this workflow as
# coverage of the entire tests/ tree.
#
# See: docs/runbooks/release-checklist.md · docs/runbooks/local-postgres-pytest.md
# Scrub shipped SPA bundles before image publish: docs/runbooks/scrub-shipped-bundles.md

name: CI tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-core:
    name: Pytest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # DB name must contain "test" (enforced by conftest.py).
          POSTGRES_DB: oneirodextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oneirodextest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Must contain "test" in the database name — never point at production.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneirodextest
      SECRET_KEY: ci-test-secret-key-not-for-production
      FLASK_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt and pins pytest.
          # Nothing here may be left unpinned: an unpinned runner turns a green
          # branch red with no repo change behind it.
          pip install -r requirements-dev.txt

      - name: Run pytest (marker set, deselect by exception)
        # Gate = every test not marked `integration`, minus a named exception
        # list. Flipped from a hand-enumerated file list on 2026-09-17 after
        # the timing job measured the marker set at 3,792 tests / 11m24s on
        # this runner (docs/dev/ci-gates.md). A new test file is now gated by
        # default; the only way to keep one out is a line below, with its ID.
        #
        # The --deselect list is docs/dev/archive/test-suite-failures-2026-09-16.md's
        # known failures as they reproduce on the runner (three are runner-
        # only: the SPA dist is not built in this job, a Windows drive-letter
        # case, the font catalogue). Remove a line when its test is fixed;
        # never add one to get a red PR green.
        #
        # Keep this bare: `run: >` is a folded scalar, so a `#` line here
        # becomes an argument to pytest rather than a comment.
        run: >
          python -m pytest tests/ -q -m "not integration"
          --cov=oneirodex --cov-report=term-missing
          --cov-fail-under=65
          --deselect tests/test_admin_spa_assets.py::test_admin_spa_dist_built
          --deselect tests/test_checkout_paths.py::test_operator_docs_checkout_is_oneirodex
          --deselect tests/test_collections_api_wiring.py::test_newsletter_ckeditor_targets_content_field
          --deselect tests/test_collections_api_wiring.py::test_spa_collections_client_covers_new_actions
          --deselect tests/test_library_roots.py::TestParseLibraryRoots::test_windows_drive_letter_is_not_mistaken_for_a_label
          --deselect tests/test_member_chrome_css.py::test_tile_hover_has_no_accent_glow_and_grows_from_center
          --deselect tests/test_member_chrome_css.py::test_topbar_cluster_is_not_a_shared_outline
          --deselect tests/test_member_spa_assets.py::test_member_spa_links_member_app_css
          --deselect tests/test_rom_archive.py::test_resolve_nested_zip_member
          --deselect tests/test_routes_admin_ext_newsletter.py::TestNewsletterIntegration::test_newsletter_recipients_parsing
          --deselect tests/test_routes_admin_ext_newsletter.py::TestNewsletterIntegration::test_newsletter_workflow_complete
          --deselect tests/test_routes_admin_ext_newsletter.py::TestNewsletterRoute::test_newsletter_get_request_success
          --deselect tests/test_routes_admin_ext_newsletter.py::TestNewsletterRoute::test_newsletter_post_email_failure
          --deselect tests/test_routes_admin_ext_newsletter.py::TestNewsletterRoute::test_newsletter_post_invalid_form
          --deselect tests/test_routes_admin_ext_newsletter.py::TestNewsletterRoute::test_newsletter_post_success
          --deselect tests/test_routes_admin_ext_settings_shell.py::TestSettingsShellSections::test_every_section_deep_link_is_reachable_from_the_react_hub
          --deselect tests/test_routes_apis_download.py::TestDeleteDownloadRequest::test_delete_invalid_request_id_zero
          --deselect tests/test_routes_apis_download.py::TestDeleteDownloadRequest::test_delete_request_database_error
          --deselect tests/test_routes_apis_download.py::TestDeleteDownloadRequest::test_delete_request_with_zip_file_success
          --deselect tests/test_routes_apis_download.py::TestDeleteDownloadRequest::test_delete_request_without_zip_file
          --deselect tests/test_routes_apis_download.py::TestDeleteDownloadRequest::test_delete_request_zip_deletion_error
          --deselect tests/test_routes_apis_download.py::TestDeleteDownloadRequest::test_delete_request_zip_outside_save_path
          --deselect tests/test_theme_fonts.py::TestCatalogue::test_reports_installed_honestly
          --deselect tests/test_utils_secondary_scrapers.py::test_enrich_game_with_steam_logs_vr_no_when_skipped
          --deselect tests/test_utils_secondary_scrapers.py::test_enrich_game_with_steam_logs_vr_yes
          --deselect tests/test_utils_secondary_scrapers.py::test_enrich_game_with_steam_reports_rollback
          --deselect tests/test_utils_secondary_scrapers.py::test_enrich_game_with_steam_still_enriches_an_already_vr_game
          --deselect tests/test_utils_unmatched.py::TestHandleDeleteUnmatched::test_handle_delete_unmatched_all_true
          --deselect tests/test_utils_unmatched.py::TestHandleDeleteUnmatchedOnly::test_handle_delete_unmatched_only_success
          --deselect tests/test_wave2c_module_ux.py::test_settings_shell_renders_module_status_badges
          --deselect tests/test_wave2c_module_ux.py::test_storage_page_surfaces_env_gates

      # UID-018 ratchet. The envelope helper landed with two files migrated and
      # the problem then grew from ~699 call sites to 1194 — new routes reached
      # for the old shapes faster than old ones were converted. Same model as
      # css-token-lint, which took CSS violations from 2365 to 1305.
      - name: Run API envelope lint
        run: python scripts/api_envelope_lint.py

      # Per-file print() baseline (A0.4). No DB; fails only when a file's
      # print() count climbs above its recorded baseline in scripts/print_lint.py.
      - name: Run print() ratchet
        run: python scripts/print_lint.py

      # Per-file request.get_json() baseline. Fails only when a file's count
      # climbs above scripts/get_json_lint.baseline.json.
      - name: Run get_json() ratchet
        run: python scripts/get_json_lint.py

  alembic-check:
    name: Alembic (upgrade + check)
    # A3.1: the schema is owned by Alembic (ADR 0004). This job proves that a
    # fresh `alembic upgrade head` applies cleanly and that `alembic check`
    # finds no drift between the migrations and models.py metadata. The baseline
    # is kept clean by a named include_object allow-list in alembic/env.py — see
    # docs/dev/alembic-baseline-notes.md — so any new diff detected here is a
    # real missing migration and must fail the gate. Runs independently of
    # pytest-core (no app fixtures needed).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # DB name must contain "test" (enforced by conftest.py).
          POSTGRES_DB: oneirodextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oneirodextest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Must contain "test" in the database name — never point at production.
      # alembic/env.py resolves DATABASE_URL first, then TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneirodextest
      SECRET_KEY: ci-test-secret-key-not-for-production
      FLASK_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt, which pins alembic.
          pip install -r requirements-dev.txt

      - name: Alembic upgrade head
        run: python -m alembic upgrade head

      - name: Alembic check (fail hard on any diff)
        # Baseline is wired clean via the include_object allow-list in
        # alembic/env.py (docs/dev/alembic-baseline-notes.md). Any new operation
        # detected here means a migration is missing — let it fail.
        run: python -m alembic check

  lint:
    name: Lint & format
    # B0.2: ESLint flat config (eslint.config.js) + Prettier --check over
    # frontend/**. The repo root has its own package.json / package-lock.json
    # holding the shared eslint + prettier toolchain, so this is a root npm ci
    # (no working-directory override on this job).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

  member-app-vitest:
    name: Member-app vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/member-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # B1.1: npm workspaces — the repo-root package-lock.json is the only
      # lockfile. One root `npm ci` reifies the whole workspace graph
      # (every frontend/* app + the @oneirodex/ui shared package + the pinned
      # tsc / eslint / prettier toolchain). This job sets
      # defaults.run.working-directory to the app dir, so the root install needs
      # an explicit working-directory: .
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Run vitest
        # package.json "test" is "vitest"; --run exits non-interactively in CI.
        # Runs from frontend/member-app (job default); npm resolves up to the
        # workspace root for tsc/vitest.
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

  admin-app-vitest:
    name: Admin-app vitest
    # Added with GT-A7: the admin ⌘K palette's index is derived from navConfig,
    # and adminCommands.test.js is what catches a destination silently dropping
    # out of it. Those tests are worth nothing unless they gate a PR.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/admin-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # B1.1: npm workspaces — one root `npm ci` reifies the whole workspace
      # graph (this app + @oneirodex/ui + the pinned tsc/eslint/prettier
      # toolchain). This job overrides working-directory, so the root install
      # needs an explicit one.
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Run vitest
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      # tests/js holds standalone harnesses for classic theme JS, run under bare
      # node against a hand-rolled micro-DOM. They were in no workflow, so they
      # gated nothing — run here because this job already has Node set up.
      - name: Run classic theme JS harnesses
        working-directory: .
        run: |
          node tests/js/preferences_modal_delegation.test.mjs
          node tests/js/od_dom_actions.test.mjs
          node tests/js/od_bridge_origin.test.mjs
          node tests/js/admin_html_injection.test.mjs

      - name: Run CSS token lint
        working-directory: .
        run: node scripts/css-token-lint.mjs

      # Explicit-`any` ratchet. strict:true is only as real as this count; the
      # member-app conversion left 1,041 sites and turned no-explicit-any off.
      # Per-file baseline in scripts/any_lint.baseline.json; only moves down.
      - name: Run explicit-any ratchet
        working-directory: .
        run: node scripts/any_lint.mjs

      # Raw `<button className="od-btn…">` ratchet. Every SPA button site moved
      # onto <Button> from @oneirodex/ui in the v11 cycle; the baseline is
      # empty, so any new hand-spelled od-btn button fails here.
      - name: Run od-btn ratchet
        working-directory: .
        run: node scripts/od_btn_lint.mjs

      # Component-size ratchet. Fourteen components over 600 lines were
      # decomposed in the v11 cycle; a non-test .tsx may not exceed 600 (or
      # its baseline) again.
      - name: Run component-size ratchet
        working-directory: .
        run: node scripts/component_size_lint.mjs

  ops-glance-vitest:
    name: Ops-glance vitest
    # ops-glance ships in the Docker image (oneirodex/static/dist/ops-glance) but
    # had no CI job — OpsApp.test.jsx / AppSmoke.test.jsx gated nothing and a
    # broken bundle could reach an operator's Admin Ops glance behind a green tick.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/ops-glance

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # B1.1: npm workspaces — one root `npm ci` reifies the whole workspace
      # graph (this app + @oneirodex/ui + the pinned tsc/eslint/prettier
      # toolchain, which `npm run typecheck` and `npm run build`'s `tsc --noEmit`
      # both need). This job overrides working-directory, so the root install
      # needs an explicit one.
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Run vitest
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build ops-glance bundle
        # ops-glance is copied into the image at build time; a bundle that fails
        # to build must not merge.
        run: npm run build

  desktop-vitest:
    name: Desktop vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # B1.1: npm workspaces — one root `npm ci` is what wires
      # clients/desktop's `"@oneirodex/api-client": "*"` workspace dependency
      # (no `file:` link step needed).
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Run fast desktop vitest slice
        # Keychain / config / connection UX, plus the three files that exercise
        # @oneirodex/api-client. The client is the desktop app's API layer (auth,
        # heartbeat, lifecycle, connect) and ships in an installed binary, so a
        # break in it must not reach users through a green tick. Full desktop
        # suite (22 files) stays local.
        run: >
          npx vitest run
          src/keychain.test.ts
          src/config-store.test.ts
          src/connection-ux.test.ts
          src/connect.test.ts
          src/launch.test.ts
          src/playtime-session.test.ts

  api-client-vitest:
    name: API client vitest
    # TD-03: @oneirodex/api-client is a real dependency of clients/desktop
    # (file: link, 13 import sites) but had no CI job of its own — its
    # client.test.ts ran nowhere. Auth header formatting is the kind of thing
    # that breaks quietly and ships in a desktop binary.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/api-client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # B1.1: npm workspaces — one root `npm ci` reifies the whole workspace
      # graph. This job overrides working-directory, so the root install needs
      # an explicit one; the Typecheck / vitest steps then run from
      # frontend/api-client (job default).
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Typecheck
        # The package ships types to the desktop client; tsc is the only thing
        # that catches an export drifting away from its consumer.
        run: npm run build

      - name: Run vitest
        run: npm test

  shared-vitest:
    name: Shared vitest
    # B1.2: @oneirodex/ui (frontend/shared) is a real workspace package with its
    # own vitest.config.js and 11 contract test files under src/*.test.* (csrf,
    # envelopeError, pageStatus, confirmDialog, toastStack, libraryScanNotify*,
    # loadingStatusText, useResource, Button, ViewerContext). They ran only
    # transitively via the SPA jobs before the B1.2 consolidation moved them
    # here — without a dedicated job the shared surface gates nothing. Modeled
    # on api-client-vitest (both are frontend/* workspace packages). PR-3
    # converted @oneirodex/ui to strict TypeScript, so this job now also runs
    # `npm run typecheck` — the only CI enforcement of the shared surface's types.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/shared

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # B1.1: npm workspaces — one root `npm ci` reifies the whole workspace
      # graph. This job overrides working-directory, so the root install needs
      # an explicit one; the vitest step then runs from frontend/shared (job
      # default).
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Typecheck
        run: npm run typecheck

# Legal free / public-domain / author-redistributable sample ROMs for Oneirodex.
# Binaries are NOT in git — operators run: python scripts/fetch-free-roms.py
# Never add commercial dumps or warez-adjacent titles here.
# Keep notes on one line (quoted) so the stdlib YAML subset parser stays reliable.

version: 1

roms:
  - id: nestest
    platform: nes
    filename: nestest.nes
    url: https://raw.githubusercontent.com/christopherpow/nes-test-roms/master/other/nestest.nes
    license: "Author-redistributable NES CPU test ROM (Kevin Horton / kevtris); mirrored for emulator testing"
    source: https://github.com/christopherpow/nes-test-roms
    notes: "Standard nestest; not a commercial game dump."

  - id: dmg-acid2
    platform: gb
    filename: dmg-acid2.gb
    url: https://github.com/mattcurrie/dmg-acid2/releases/download/v1.0/dmg-acid2.gb
    license: MIT
    source: https://github.com/mattcurrie/dmg-acid2
    notes: "Tobu Tobu Girl is MIT/CC-BY but itch.io-only (no GitHub release ROM); dmg-acid2 is the GitHub-fetchable GB substitute."

  - id: cascade7
    platform: gba
    filename: CASCADE7.gba
    url: https://github.com/mick-schroeder/gba-cascade7/releases/download/v1.0.0/CASCADE7.gba
    license: MIT
    source: https://github.com/mick-schroeder/gba-cascade7
    notes: "Open-source GBA puzzle homebrew with a clear GitHub Releases ROM."

  - id: cgb-acid2
    platform: gbc
    filename: cgb-acid2.gbc
    url: https://github.com/mattcurrie/cgb-acid2/releases/download/v1.1/cgb-acid2.gbc
    license: MIT
    source: https://github.com/mattcurrie/cgb-acid2
    notes: "Game Boy Color PPU test ROM; the GBC counterpart of dmg-acid2."

  - id: genmddj
    platform: genesis
    filename: genmddj-v0.17.bin
    url: https://github.com/little-scale/genmddj/releases/download/v0.17/genmddj-v0.17.bin
    license: MIT
    source: https://github.com/little-scale/genmddj
    notes: "Original Mega Drive / Genesis music-tracker homebrew (not a commercial dump)."

  - id: atari2600-4paddle-tester
    platform: atari2600
    filename: atari2600-4paddle-tester.a26
    url: https://github.com/alijani1/atari2600-4paddle-tester/releases/download/v1.0.0/atari2600-4paddle-tester.a26
    license: MIT
    source: https://github.com/alijani1/atari2600-4paddle-tester
    notes: "Atari 2600 paddle diagnostic homebrew; Stella-compatible."

  - id: superbossgaiden
    platform: snes
    filename: SuperBossGaiden.sfc
    url: https://github.com/snesdev0815/SNES-SuperBossGaiden/releases/download/v1.2/SuperBossGaiden.sfc
    license: "Author-released freeware SNES homebrew (Dieter von Laser / ChronoMoogle); GitHub release by the author"
    source: https://github.com/snesdev0815/SNES-SuperBossGaiden
    notes: "Not a commercial dump. ROM is the author-published GitHub release asset."

  - id: pong-oman
    platform: n64
    filename: pong-oman.z64
    url: https://raw.githubusercontent.com/DerekTurtleRoe/N64-PD-ROMS/master/ROMS/Homebrew/Pong%20by%20Oman%20%28PD%29.z64
    license: "Public domain (declared for the whole N64-PD-ROMS repository by its LICENSE.md)"
    source: https://github.com/DerekTurtleRoe/N64-PD-ROMS
    notes: "256 KB Pong homebrew by Oman; the repo collects public-domain N64 homebrew, demos and test ROMs."

  - id: jumtro
    platform: lynx
    filename: jumtro.lnx
    url: https://www.zophar.net/download_file/11850
    archive: zip
    license: "Listed under Public Domain ROMs on Zophar's Domain (author-distributed homebrew demo by James Higgs)"
    source: https://www.zophar.net/pdroms/lynx/jumtro.html
    notes: "Atari Lynx demo with C source. URL taken from the Zophar page; not download-verified from the dev sandbox, so run the fetcher once to confirm."

  - id: super-fighter-demo
    platform: vb
    filename: super-fighter-demo.vb
    url: https://www.zophar.net/download_file/11861
    archive: zip
    license: "Listed under Public Domain ROMs on Zophar's Domain (author-distributed Virtual Boy demo by KR155E and Death Adder)"
    source: https://www.zophar.net/pdroms/vboy/super-fighter-demo.html
    notes: "Virtual Boy demo. URL taken from the Zophar page; not download-verified from the dev sandbox, so run the fetcher once to confirm."

# Platforms Oneirodex can browser/companion-play, but no clear legal GitHub URL yet.
skipped:
  - platform: sega_ms
    note: "Companion/browser ready -- place ROM after fetch when available. No clearly licensed Master System homebrew ROM URL verified."
  - platform: sega_gg
    note: "Browser core ships (genesis_plus_gx); no clearly licensed Game Gear homebrew ROM URL verified."
  - platform: sega_sg1000
    note: "Browser-playable via genesis_plus_gx; no clearly licensed SG-1000 homebrew ROM URL verified."
  - platform: ngpc
    note: "Browser-playable via mednafen_ngp (same WASM as NGP); no clearly licensed NGPC homebrew ROM URL verified."
  - platform: nds
    note: "Browser core ships; no clearly licensed NDS homebrew ROM URL verified."
  - platform: psx
    note: "Needs operator BIOS; no legal PS1 game dump. Homebrew ISOs are not auto-fetched."
  - platform: sega_saturn
    note: "Needs operator BIOS; no legal Saturn dump auto-fetched."
  - platform: jaguar
    note: "Browser core ships; no clearly licensed Jaguar homebrew ROM URL verified."
  - platform: ws
    note: "Browser core ships; no clearly licensed WonderSwan homebrew ROM URL verified."
  - platform: ngp
    note: "Browser core ships; no clearly licensed Neo Geo Pocket homebrew ROM URL verified."
  - platform: coleco
    note: "Needs operator BIOS (colecovision.rom); no clearly licensed Coleco homebrew ROM URL verified."
  - platform: vectrex
    note: "Browser core ships; no clearly licensed Vectrex homebrew ROM URL verified."
  - platform: threedo
    note: "Needs operator BIOS; no legal 3DO dump auto-fetched."
  - platform: neogeo_cd
    note: "Needs operator BIOS; no legal Neo Geo CD dump auto-fetched."
  - platform: intv
    note: "Needs operator BIOS; no clearly licensed Intellivision homebrew ROM URL verified."
  - platform: chaf
    note: "Needs operator BIOS; no clearly licensed Channel F homebrew ROM URL verified."
  - platform: o2em
    note: "Needs operator BIOS; no clearly licensed Odyssey 2 homebrew ROM URL verified."
  - platform: atari_5200
    note: "Needs operator BIOS (5200.rom); 2600 paddle tester is the Atari sample we do fetch."
  - platform: atari_7800
    note: "Needs operator BIOS; no clearly licensed 7800 homebrew ROM URL verified."

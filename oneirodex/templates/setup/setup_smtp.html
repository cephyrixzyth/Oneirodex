{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/setup/setup.css'|theme_asset }}">

<div class="container-login">
    <div class="content-login od-setup" role="main" aria-labelledby="od-setup-smtp-title">
        <nav class="od-setup-progress" aria-label="Setup progress">
      <span>1 · Admin</span><span aria-current="step">2 · Email</span><span>3 · Features</span><span>4 · Metadata</span><span>5 · APIs</span><span>6 · Library</span>
        </nav>
        <div class="od-setup__brand">
            <img
                src="{{ url_for('static', filename='newstyle/oneirodex_mark.svg') }}"
                alt=""
                class="od-setup__mark"
                width="56"
                height="56"
                decoding="async"
            >
            <h1 id="od-setup-smtp-title" class="od-setup__title">Email (SMTP)</h1>
            <p class="od-setup__lede">Optional — enables invites, registration mail, and password reset.</p>
        </div>

        <form method="POST" action="{{ url_for('setup.setup_smtp') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label><input type="checkbox" name="smtp_enabled" value="true" class="form-check-input"> Enable SMTP (only if you have mail server credentials)</label>
            </div>

            <div class="form-group">
                <label for="smtp_server">SMTP Server</label>
                <input type="text" id="smtp_server" name="smtp_server" class="od-setup__field" autocomplete="url">
            </div>

            <div class="form-group">
                <label for="smtp_port">SMTP Port</label>
                <input type="number" id="smtp_port" name="smtp_port" value="587" class="od-setup__field">
            </div>

            <div class="form-group">
                <label for="smtp_username">SMTP Username</label>
                <input type="text" id="smtp_username" name="smtp_username" class="od-setup__field" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="smtp_password">SMTP Password</label>
                <input type="password" id="smtp_password" name="smtp_password" class="od-setup__field" autocomplete="off">
            </div>

            <div class="form-group">
                <label><input type="checkbox" name="smtp_use_tls" value="true" checked class="form-check-input"> Use TLS</label>
            </div>

            <div class="form-group">
                <label for="smtp_default_sender">Default sender email</label>
                <input type="email" id="smtp_default_sender" name="smtp_default_sender" class="od-setup__field" autocomplete="email">
            </div>

            <div class="form-group od-setup__actions">
                <button type="submit" class="btn btn-primary">Next step</button>
                <button type="submit" name="skip_smtp" value="1" class="btn btn-secondary">Skip SMTP</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

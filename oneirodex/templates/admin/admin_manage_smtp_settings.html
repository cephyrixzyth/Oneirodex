{% extends "base_admin.html" %}
{% block title %}SMTP · Oneirodex Admin{% endblock %}
{% block content %}
{% import 'partials/icons.html' as icons %}

<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="{{ 'css/admin/admin_manage_smtp_settings.css'|theme_asset }}">

<div class="container-settings od-adminpage od-adminpage--xl">
    <div class="od-adminpage-header">
        <div>
            <h1 class="od-adminpage-title">{{ icons.icon('envelope', size=26) }} SMTP Settings</h1>
        </div>
    </div>

    <div class="od-adminpage-panel">
        <div class="od-adminpage-panel-header">
            <h2>SMTP Settings
                <button type="button" class="btn btn-info btn-sm smtp-help-open" title="SMTP help" aria-haspopup="dialog" aria-controls="smtpHelpModal">
                    {{ icons.icon('help') }}
                </button>
            </h2>
        </div>
        {% include 'partials/integrations/smtp_form.html' %}
    </div>
</div>

<script src="{{ 'js/admin_manage_smtp_settings.js'|theme_asset }}"></script>

{% endblock %}

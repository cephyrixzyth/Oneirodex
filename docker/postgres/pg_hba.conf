# Oneirodex Compose Postgres — client auth (private Docker network).
# Mounted read-only; activated via: postgres -c hba_file=/etc/oneirodex/pg_hba.conf
#
# Two layers decide who can reach this database:
#   1. docker-compose.yml publishes the port on 127.0.0.1 unless the operator
#      sets POSTGRES_HOST_BIND. The app container never uses that mapping.
#   2. This file. Every TCP rule below is scram-sha-256 AND limited to private
#      (RFC 1918 / ULA) ranges, so a public source address is refused even if
#      the port is ever forwarded by mistake. There is deliberately no
#      0.0.0.0/0 or ::/0 rule.
#
# Do not publish 5432 to the public internet, and set a strong POSTGRES_PASSWORD.
#
# If the app logs `no pg_hba.conf entry for host "<ip>"` with an address outside
# these ranges (a custom Docker address pool, Tailscale 100.64.0.0/10, a global
# IPv6 prefix), add a matching line for that CIDR, then:
#   docker compose up -d --force-recreate db
# See docs/runbooks/container-wont-start.md section 3b.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
# App container connects over TCP without SSL ("no encryption" in logs).
# Password still required (scram). Docker's default bridge pools sit inside
# 172.16.0.0/12 and 192.168.0.0/16; a LAN client (only when the operator opted
# in to a LAN bind) is normally inside 192.168.0.0/16 or 10.0.0.0/8.
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
host    all             all             fc00::/7                scram-sha-256
